.btn[aria-pressed="true"]{background:var(--text-primary);color:var(--surface-1);border-color:var(--text-primary)}
.tabs{display:flex;gap:6px;margin:16px 0 2px;border-bottom:1px solid var(--grid);padding-bottom:10px;flex-wrap:wrap}
.ctl{display:flex;gap:6px;align-items:center;margin:14px 0 2px;flex-wrap:wrap}
.ctl .lab{font-size:11.5px;color:var(--muted);margin-right:4px}
.legend{display:flex;gap:18px;margin:10px 0 2px;font-size:11.5px;color:var(--text-secondary);flex-wrap:wrap;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block}
.wrap{position:relative}
svg{display:block;width:100%;height:auto}svg text{pointer-events:none}
.tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .08s;background:var(--surface-1);border:1px solid var(--border);
 border-radius:8px;padding:9px 11px;font-size:11.5px;line-height:1.5;color:var(--text-primary);box-shadow:0 3px 14px rgba(0,0,0,.13);max-width:290px;z-index:5}
.tip b{font-size:12.5px}.tip .row{color:var(--text-secondary)}
.tag{display:inline-block;margin-top:4px;padding:1px 6px;border-radius:4px;font-size:10.5px;color:var(--surface-1);background:var(--hit)}
.tag.no{background:var(--neutral)}
.detail{margin-top:14px;border:1px solid var(--border);border-radius:8px;padding:13px 15px;font-size:12px;line-height:1.6;color:var(--text-secondary);background:var(--page)}

.detail code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--text-primary)}
.detail a{color:var(--s2)}
.foot{margin-top:14px;padding-top:11px;border-top:1px solid var(--grid);font-size:11px;color:var(--muted);line-height:1.6}

  const note=/香江万基/.test(p.n)?"Luoyang Xiangjiang Wanji — refinery 2005, circuit 2025":
             /山东铝厂|中铝山东/.test(p.n)?"Chalco Shandong — the first circuit, 1956":
             /文山/.test(p.n)?"Yunnan Wenshan — refinery 2012, circuit 2025":null;
  if(note){const right=XX(p.gy)>W-300;
   el(svg,"text",{x:XX(p.gy)+(right?-9:9),y:y+3.5,"text-anchor":right?"end":"start","font-size":9.5,fill:"var(--text-primary)"},note);}
  const show=ev=>{tip.innerHTML="<b>"+p.n+"</b><div class='row'>host commissioned "+p.host+" · circuit "+p.ga+" ("+p.conf+" confidence)</div>"+
   "<div class='row'>operator: "+(p.op||"—")+" · alumina "+p.cap+" kt</div>";tip.style.opacity=1;move(ev);};
  c.addEventListener("mouseenter",show);c.addEventListener("mousemove",move);c.addEventListener("mouseleave",()=>tip.style.opacity=0);
  c.addEventListener("click",()=>{det.innerHTML="<h3>"+p.n+"</h3>"+
   "<div>Host refinery commissioned <code>"+p.host+"</code>; gallium circuit dated <code>"+p.ga+"</code> at <code>"+p.conf+"</code> confidence — a lag of about "+(p.gy-p.hy)+" years.</div>"+
   "<div>Operator: <code>"+(p.op||"—")+"</code>. Alumina capacity <code>"+p.cap+" kt</code>. Gallium capacity <code>"+(p.gcap||"—")+"</code>.</div>"+
   "<div>Dates are not computed; each is read from a Chinese-language source and kept verbatim in the census: "+p.ev+src(p.l)+"</div>";});
 });
 svg.setAttribute("viewBox","0 0 "+W+" "+(top+dated.length*rowH+40));
 foot.innerHTML="Capacity never falls in any year of the series. Through the 2011–16 price collapse (−67%) and the 2015–16 output collapse (−61%) it held at 600 t. "+
  "Of the 44 refineries in the census, 23 run a gallium circuit and "+dated.length+" carry a usable date: ten by 2015, eight from 2020 onward, and none dated to the years between.";
}

/* ---------------- H2a ---------------- */
function drawMap(){
 mkbtns(DATA.exams.map(e=>e.id+" · "+e.date.slice(0,7)),exam,i=>{exam=i;render();},"Cutoff");
 legend([["var(--hit)","restricted at this exam or later"],["var(--neutral)","never restricted"]]);
 const s=document.createElement("span");s.innerHTML='<svg width="14" height="14" style="vertical-align:-3px"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg> engine top-ten pick';leg.appendChild(s);
 svg.setAttribute("viewBox","0 0 1000 560");
 const E=DATA.exams[exam],ML=64,MR=210,MT=18,MB=52;
 const pts=E.rows.filter(r=>r.news!=null&&r.share!=null&&r.st!=="already_controlled");
 const xs=pts.map(p=>Math.log10(Math.max(p.news,1))),ys=pts.map(p=>p.share);
 const x1=Math.max(...xs)+0.25;
 const X=v=>ML+(Math.log10(Math.max(v,1)))/x1*(W-ML-MR),Y=v=>MT+(H-MT-MB)-(v/102)*(H-MT-MB);
 const mx=med(xs),my=med(ys),mX=ML+mx/x1*(W-ML-MR);
 [0,25,50,75,100].forEach(t=>{el(svg,"line",{x1:ML,x2:W-MR,y1:Y(t),y2:Y(t),stroke:t?"var(--grid)":"var(--baseline)","stroke-width":1});
  el(svg,"text",{x:ML-8,y:Y(t)+3.5,"text-anchor":"end","font-size":10.5,fill:"var(--muted)"},t+"%");});
 [1,10,100,1000,10000,100000].forEach(t=>{if(Math.log10(t)>x1)return;
  el(svg,"line",{x1:X(t),x2:X(t),y1:H-MB,y2:H-MB+4,stroke:"var(--baseline)","stroke-width":1});
  el(svg,"text",{x:X(t),y:H-MB+17,"text-anchor":"middle","font-size":10.5,fill:"var(--muted)"},t.toLocaleString());});
 el(svg,"text",{x:(ML+W-MR)/2,y:H-MB+36,"text-anchor":"middle","font-size":11.5,fill:"var(--text-secondary)"},"supply-chain news articles, prior 24 months (log scale) →");
 el(svg,"text",{x:16,y:(MT+H-MB)/2,"font-size":11.5,fill:"var(--text-secondary)","text-anchor":"middle",transform:"rotate(-90 16 "+((MT+H-MB)/2)+")"},"China's share of the restricted production stage →");
 el(svg,"line",{x1:mX,x2:mX,y1:MT,y2:H-MB,stroke:"var(--baseline)","stroke-width":1,"stroke-dasharray":"3 4"});
 el(svg,"line",{x1:ML,x2:W-MR,y1:Y(my),y2:Y(my),stroke:"var(--baseline)","stroke-width":1,"stroke-dasharray":"3 4"});
 [[ML+8,MT+14,"1 · latent zone","start"],[W-MR-8,MT+14,"2 · landmark zone","end"],[ML+8,H-MB-10,"3 · dust corner","start"],[W-MR-8,H-MB-10,"4 · bulk celebrities","end"]]
  .forEach(q=>el(svg,"text",{x:q[0],y:q[1],"text-anchor":q[3],"font-size":11.5,"font-weight":650,fill:"var(--muted)"},q[2]));
 pts.sort((a,b)=>(a.restricted?1:0)-(b.restricted?1:0));
 pts.forEach(p=>{const hit=!!p.restricted,top=p.rk&&p.rk<=10;
  const c=el(svg,"circle",{cx:X(p.news),cy:Y(p.share),r:hit?6:4.5,fill:hit?"var(--hit)":"var(--neutral)",
   stroke:top?"var(--text-primary)":"var(--surface-1)","stroke-width":top?1.8:1.4,style:"cursor:pointer"});
  c.addEventListener("mouseenter",ev=>{tip.innerHTML="<b>"+p.c+"</b><div class='row'>share "+p.share+"% · "+p.news.toLocaleString()+" articles · rank "+(p.rk||"—")+"</div>"+
    (p.restricted?'<span class="tag">restricted '+p.rdate+'</span>':'<span class="tag no">never restricted</span>');tip.style.opacity=1;move(ev);});
  c.addEventListener("mousemove",move);c.addEventListener("mouseleave",()=>tip.style.opacity=0);
  c.addEventListener("click",()=>detailMap(p,E));});
 const top10=pts.filter(p=>p.rk&&p.rk<=10).sort((a,b)=>a.rk-b.rk);
 top10.forEach((p,i)=>el(svg,"text",{x:X(p.news),y:Y(p.share)-(i%2?9:20),"text-anchor":"middle","font-size":9.5,"font-weight":650,fill:"var(--text-primary)"},String(p.rk)));
 const px=W-MR+18;
 el(svg,"text",{x:px,y:MT+14,"font-size":11.5,"font-weight":650,fill:"var(--text-primary)"},"Top ten at this cutoff");
 top10.forEach((p,i)=>{const yy=MT+36+i*20;
  el(svg,"circle",{cx:px+5,cy:yy-3.5,r:4.5,fill:p.restricted?"var(--hit)":"var(--neutral)",stroke:"var(--text-primary)","stroke-width":1.4});
  el(svg,"text",{x:px+16,y:yy,"font-size":10.5,fill:"var(--text-primary)"},p.rk+". "+p.c.replace(" (industrial)",""));});
 const nhit=top10.filter(p=>p.restricted).length;
 el(svg,"text",{x:px,y:MT+36+200+8,"font-size":10.5,fill:"var(--text-secondary)"},nhit+" of 10 later restricted");
 foot.innerHTML="<strong>Exam "+E.id+"</strong> — "+E.date+", "+E.no+". Restricted at this announcement: "+E.pos.join(", ")+
  ". Commodities already under control are removed from the pool and from this chart. Quadrant lines are medians of the live pool; the analysis uses the continuous score, not the quadrants.";
}
function detailMap(p,E){
 const lg=x=>Math.log(1+x);
 det.innerHTML="<h3>"+p.c+" — exam "+E.id+" ("+E.date+")</h3>"+
  "<div><b>Visibility.</b> <code>V = ln(1+"+p.news+") ÷ ln(1+max) = "+fmt(lg(p.news),3)+" ÷ "+fmt(E.maxlog,3)+" = "+fmt(p.V,4)+"</code>, where the denominator is the largest count in the pool still uncontrolled at this cutoff. Invisibility = 1 − V = <code>"+fmt(p.inv,4)+"</code>."+src(p.lv,"raw count row")+"</div>"+
  "<div><b>Latent power.</b> <code>"+p.share+"/100 × "+fmt(p.inv,4)+" = "+fmt(p.lat,4)+"</code> → rank <code>"+(p.rk||"—")+"</code> of "+E.rows.filter(r=>r.rk).length+" scored rows."+src(p.lr,"ranking row")+"</div>"+
  "<div><b>Outcome.</b> "+(p.restricted?"Restricted on <code>"+p.rdate+"</code> (exam "+p.restricted+").":"Never restricted through 2025.")+
   (p.jump!=null?" News after its own announcement: <code>"+p.post30+" ÷ "+fmt(p.base,2)+" = ×"+fmt(p.jump,1)+"</code>."+src(p.la,"attention row"):"")+
   (p.px!=null?" Offshore price, first month: <code>"+p.px+"%</code> ("+p.pxq+")."+src(p.lp,"price row"):"")+"</div>";
}

/* ---------------- H2b ---------------- */
function drawH2b(){
 const INST=[["News jump","×"],["Stock CAR","%"],["Offshore price, 1 month","%"]];
 mkbtns(INST.map(i=>i[0]),inst,i=>{inst=i;render();},"Instrument");
 svg.setAttribute("viewBox","0 0 1000 520");
 const ML=70,MR=30,MT=20,MB=54,HH=520;
 let pts=[];
 if(inst===0){const byc={};
  DATA.exams.forEach(E=>E.rows.forEach(r=>{ if(r.jump!=null&&r.inv!=null&&!byc[r.c]&&r.restricted===E.id) byc[r.c]={x:r.inv,y:r.jump,c:r.c,r:r}; }));
  pts=Object.values(byc);}
 else if(inst===1){pts=DATA.stocks.map(s=>({x:s.inv,y:s.car,c:s.name+" ("+s.c+")",s}));}
 else {pts=DATA.prices.filter(p=>p.inv!=null&&!isNaN(parseFloat(p.px))).map(p=>({x:p.inv,y:parseFloat(p.px),c:p.c,p}));}
 const ys=pts.map(p=>p.y),xs=pts.map(p=>p.x);
 const y1=Math.max(...ys)*1.08,y0=Math.min(0,Math.min(...ys)*1.1);
 const x0=Math.min(...xs)-0.02,x1=Math.max(...xs)+0.02;
 const X=v=>ML+(v-x0)/(x1-x0)*(W-ML-MR),Y=v=>MT+(HH-MT-MB)-((v-y0)/(y1-y0))*(HH-MT-MB);
 const ticks=4;
 for(let i=0;i<=ticks;i++){const t=y0+(y1-y0)*i/ticks;
  el(svg,"line",{x1:ML,x2:W-MR,y1:Y(t),y2:Y(t),stroke:i?"var(--grid)":"var(--baseline)","stroke-width":1});
  el(svg,"text",{x:ML-8,y:Y(t)+3.5,"text-anchor":"end","font-size":10.5,fill:"var(--muted)"},(inst===0?"×":"")+Math.round(t)+(inst?"%":""));}
 [0.35,0.45,0.55,0.65,0.75].forEach(t=>{if(t<x0||t>x1)return;
  el(svg,"line",{x1:X(t),x2:X(t),y1:HH-MB,y2:HH-MB+4,stroke:"var(--baseline)","stroke-width":1});
  el(svg,"text",{x:X(t),y:HH-MB+17,"text-anchor":"middle","font-size":10.5,fill:"var(--muted)"},t.toFixed(2));});
 el(svg,"text",{x:(ML+W-MR)/2,y:HH-MB+36,"text-anchor":"middle","font-size":11.5,fill:"var(--text-secondary)"},"pre-event invisibility (1 − V) →");
 el(svg,"text",{x:16,y:(MT+HH-MB)/2,"font-size":11.5,fill:"var(--text-secondary)","text-anchor":"middle",transform:"rotate(-90 16 "+((MT+HH-MB)/2)+")"},INST[inst][0]+" →");
 const mx=med(xs);
 el(svg,"line",{x1:X(mx),x2:X(mx),y1:MT,y2:HH-MB,stroke:"var(--baseline)","stroke-width":1,"stroke-dasharray":"3 4"});
 el(svg,"text",{x:X(mx)+6,y:MT+12,"font-size":10.5,fill:"var(--muted)"},"median invisibility");
 pts.forEach(p=>{const c=el(svg,"circle",{cx:X(p.x),cy:Y(p.y),r:5.5,fill:"var(--hit)",stroke:"var(--surface-1)","stroke-width":1.4,style:"cursor:pointer"});
  el(svg,"text",{x:X(p.x)+8,y:Y(p.y)+3.5,"font-size":9.5,fill:"var(--text-secondary)"},p.c.replace(" (industrial)","").slice(0,22));
  c.addEventListener("mouseenter",ev=>{tip.innerHTML="<b>"+p.c+"</b><div class='row'>invisibility "+fmt(p.x,3)+" · "+(inst===0?"×"+fmt(p.y,1):fmt(p.y,1)+"%")+"</div>";tip.style.opacity=1;move(ev);});
  c.addEventListener("mousemove",move);c.addEventListener("mouseleave",()=>tip.style.opacity=0);
  c.addEventListener("click",()=>detailH2b(p));});
 const hi=pts.filter(p=>p.x>=mx).map(p=>p.y),lo=pts.filter(p=>p.x<mx).map(p=>p.y);
 foot.innerHTML="n = "+pts.length+". Median above the invisibility median: <strong>"+(inst===0?"×":"")+fmt(med(hi),1)+(inst?"%":"")+
  "</strong>; below it: <strong>"+(inst===0?"×":"")+fmt(med(lo),1)+(inst?"%":"")+"</strong>. "+
  (inst===0?"Diamond sits at zero — no US article in the thirty days after its restriction, a real reading rather than a missing one.":
   inst===1?"One row per listed producer, so a commodity with several pure-exposure names appears more than once.":
   "Points with no reaction are included deliberately; the deepest-latent rare earths have no offshore quotation at all and cannot appear.");
}
function detailH2b(p){
 if(p.r){const r=p.r;det.innerHTML="<h3>"+r.c+" — news jump</h3>"+
  "<div><b>How it is computed.</b> <code>articles in the 30 days after the announcement ÷ mean monthly articles over the prior 24 months = "+r.post30+" ÷ "+fmt(r.base,2)+" = ×"+fmt(r.jump,1)+"</code>.</div>"+
  "<div><b>Position on the map.</b> pre-event invisibility <code>"+fmt(r.inv,4)+"</code>, latent power <code>"+fmt(r.lat,4)+"</code>, rank <code>"+(r.rk||"—")+"</code> at exam "+r.restricted+"."+src(r.lr,"ranking row")+"</div>"+
  "<div>"+src(r.la,"attention row on GitHub")+"</div>";}
 else if(p.s){const s=p.s;det.innerHTML="<h3>"+s.name+" — stock reaction</h3>"+
  "<div><b>How it is computed.</b> Five-day buy-and-hold return from the market-aligned event day minus the CSI 300 over the same window: <code>"+fmt(s.car,2)+"%</code>.</div>"+
  "<div>Pure-exposure A-share for <code>"+s.c+"</code>; pre-event invisibility <code>"+fmt(s.inv,3)+"</code>; event "+s.e+"."+src(s.l,"stock row on GitHub")+"</div>";}
 else {const q=p.p;det.innerHTML="<h3>"+q.c+" — offshore price</h3>"+
  "<div><b>How it is computed.</b> Percentage change in the offshore quotation over roughly the month after the announcement: <code>"+q.px+"%</code>. The domestic price falls when exports are blocked, so the offshore move is the power reading.</div>"+
  "<div>Basis and quality: "+q.q+". Pre-event invisibility <code>"+fmt(q.inv,3)+"</code>; exam "+q.e+"."+src(q.l,"price row on GitHub")+"</div>";}
}
function move(ev){const w=document.querySelector(".wrap").getBoundingClientRect();
 let x=ev.clientX-w.left+14,y=ev.clientY-w.top+14;
 if(x+300>w.width)x=ev.clientX-w.left-310;if(y+120>w.height)y=ev.clientY-w.top-120;
 tip.style.left=x+"px";tip.style.top=y+"px";}
render();
})();
</script></body></html>
