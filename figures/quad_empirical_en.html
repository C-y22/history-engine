<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Empirical quadrants</title>
<style>
  :root { color-scheme: light;
    --surface-1:#fcfcfb; --page:#f9f9f7; --ink-1:#0b0b0b; --ink-2:#52514e; --ink-muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s2:#eb6834; --wash:rgba(42,120,214,0.07);
    --border:rgba(11,11,11,0.10); }
  *{box-sizing:border-box;margin:0}
  body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--page);color:var(--ink-1);display:flex;justify-content:center;padding:28px 14px}
  .fig{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;
    padding:28px 32px 22px;max-width:900px;width:100%}
  h1{font-size:18px;font-weight:650}
  .sub{font-size:12.5px;color:var(--ink-2);margin-top:5px;line-height:1.55}
  .legend{display:flex;gap:18px;margin-top:14px;font-size:12px;color:var(--ink-2);align-items:center;flex-wrap:wrap}
  .key{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  svg{width:100%;height:auto;margin-top:6px}
  .qlabel{font-size:12px;fill:var(--ink-muted);font-weight:600}
  .pt-label{font-size:12.5px;fill:var(--ink-1);font-weight:600}
  .pt-sub{font-size:10px;fill:var(--ink-muted)}
  .axis-t{font-size:11px;fill:var(--ink-muted)}
  .foot{font-size:11px;color:var(--ink-muted);margin-top:10px;line-height:1.6;
    border-top:1px solid var(--grid);padding-top:10px}
</style>
</head>
<body>
<figure class="fig">
  <h1>What later happened to the residents of the latent zone</h1>
  <div class="sub">X-axis: news visibility (English coverage counts, 2021-07 to 2023-06, log scale). Y-axis: criticality (USGS 2021 supply-risk score). All data as of 2023-07-02, the day before the gallium/germanium announcement.</div>
  <div class="legend">
    <span class="key"><span class="dot" style="background:var(--s2)"></span>Later placed under Chinese export controls (2023–2025)</span>
    <span class="key"><span class="dot" style="background:var(--s1)"></span>Untouched to date</span>
  </div>
  <svg viewBox="0 0 860 500">
    <rect x="60" y="40" width="422" height="177" fill="var(--wash)"/>
    <line x1="144" y1="40" x2="144" y2="420" stroke="var(--grid)" stroke-width="1"/>
    <line x1="313" y1="40" x2="313" y2="420" stroke="var(--grid)" stroke-width="1"/>
    <line x1="651" y1="40" x2="651" y2="420" stroke="var(--grid)" stroke-width="1"/>
    <line x1="60" y1="116" x2="820" y2="116" stroke="var(--grid)" stroke-width="1"/>
    <line x1="60" y1="319" x2="820" y2="319" stroke="var(--grid)" stroke-width="1"/>
    <line x1="482" y1="40" x2="482" y2="420" stroke="var(--axis)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="60" y1="217" x2="820" y2="217" stroke="var(--axis)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="60" y1="420" x2="820" y2="420" stroke="var(--axis)" stroke-width="1.5"/>
    <line x1="60" y1="40" x2="60" y2="420" stroke="var(--axis)" stroke-width="1.5"/>
    <text x="144" y="438" text-anchor="middle" class="axis-t">10²</text>
    <text x="313" y="438" text-anchor="middle" class="axis-t">10³</text>
    <text x="482" y="438" text-anchor="middle" class="axis-t">10⁴</text>
    <text x="651" y="438" text-anchor="middle" class="axis-t">10⁵</text>
    <text x="820" y="438" text-anchor="end" class="axis-t">coverage →</text>
    <text x="48" y="120" text-anchor="end" class="axis-t">0.6</text>
    <text x="48" y="221" text-anchor="end" class="axis-t">0.40</text>
    <text x="48" y="323" text-anchor="end" class="axis-t">0.2</text>
    <text x="14" y="44" class="axis-t" transform="rotate(-90 14 44)" text-anchor="end">criticality →</text>
    <text x="72" y="60" class="qlabel">1. Latent zone (the hunting ground)</text>
    <text x="808" y="60" class="qlabel" text-anchor="end">2. Landmark zone (already priced in)</text>
    <text x="72" y="410" class="qlabel">4. Dust corner (false-positive trap)</text>
    <text x="808" y="410" class="qlabel" text-anchor="end">3. Bulk celebrities</text>
    <circle cx="131" cy="80" r="7" fill="var(--s2)" stroke="var(--surface-1)" stroke-width="2"/>
    <text x="145" y="84" class="pt-label">Gallium 0.67</text>
    <text x="145" y="98" class="pt-sub">controlled 2023-07</text>
    <circle cx="297" cy="116" r="7" fill="var(--s1)" stroke="var(--surface-1)" stroke-width="2"/>
    <text x="310" y="112" class="pt-label">Fluorspar 0.60</text>
    <text x="310" y="124" class="pt-sub">untouched → #1 standing prediction</text>
    <circle cx="446" cy="172" r="7" fill="var(--s2)" stroke="var(--surface-1)" stroke-width="2"/>
    <text x="440" y="158" text-anchor="end" class="pt-label">Germanium 0.49</text>
    <text x="440" y="146" text-anchor="end" class="pt-sub">controlled 2023-07</text>
    <circle cx="391" cy="215" r="7" fill="var(--s2)" stroke="var(--surface-1)" stroke-width="2"/>
    <text x="391" y="240" text-anchor="middle" class="pt-label">Tellurium 0.40</text>
    <text x="391" y="252" text-anchor="middle" class="pt-sub">controlled 2025-02</text>
    <circle cx="540" cy="151" r="7" fill="var(--s2)" stroke="var(--surface-1)" stroke-width="2"/>
    <text x="553" y="147" class="pt-label">Antimony 0.53</text>
    <text x="553" y="159" class="pt-sub">controlled 2024-08</text>
    <circle cx="644" cy="182" r="7" fill="var(--s2)" stroke="var(--surface-1)" stroke-width="2"/>
    <text x="657" y="178" class="pt-label">Graphite 0.47</text>
    <text x="657" y="190" class="pt-sub">controlled 2023-10</text>
    <circle cx="575" cy="207" r="7" fill="var(--s2)" stroke="var(--surface-1)" stroke-width="2"/>
    <text x="575" y="196" text-anchor="middle" class="pt-label">Indium 0.41</text>
    <circle cx="673" cy="106" r="7" fill="var(--s1)" stroke="var(--surface-1)" stroke-width="2"/>
    <text x="686" y="106" class="pt-label">Cobalt 0.65</text>
    <circle cx="773" cy="220" r="7" fill="var(--s1)" stroke="var(--surface-1)" stroke-width="2"/>
    <text x="773" y="243" text-anchor="middle" class="pt-label">Lithium 0.40</text>
    <circle cx="737" cy="264" r="7" fill="var(--s1)" stroke="var(--surface-1)" stroke-width="2"/>
    <text x="737" y="287" text-anchor="middle" class="pt-label">Nickel 0.36</text>
    <circle cx="362" cy="344" r="7" fill="var(--s1)" stroke="var(--surface-1)" stroke-width="2"/>
    <text x="375" y="340" class="pt-label">Rubidium (low criticality)</text>
    <text x="375" y="352" class="pt-sub">negative case: engine should stay quiet ✓</text>
  </svg>
  <div class="foot">Pilot illustration (2026-08). The full version scores all 100 commodities with the same context-count method. Controlled residents of the latent zone were hit 7–19 months after this map was drawn.</div>
</figure>
</body>
</html>
